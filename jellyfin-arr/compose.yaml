services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - ${DATA_ROOT:-./data}:/data:ro
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/bazarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyseerr:/app/config
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:-./data}/downloads:/data/downloads
    ports:
      - "${QBITTORRENT_PORT:-8080}:8080"
      - "${TORRENT_PORT:-6881}:6881"
      - "${TORRENT_PORT:-6881}:6881/udp"
    restart: unless-stopped
